name: Visual Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VR_STUDENT_EMAIL:    ${{ secrets.VR_STUDENT_EMAIL }}
      VR_STUDENT_PASSWORD: ${{ secrets.VR_STUDENT_PASSWORD }}
      VR_ADMIN_EMAIL:      ${{ secrets.VR_ADMIN_EMAIL }}
      VR_ADMIN_PASSWORD:   ${{ secrets.VR_ADMIN_PASSWORD }}
      VR_SA_EMAIL:         ${{ secrets.VR_SA_EMAIL }}
      VR_SA_PASSWORD:      ${{ secrets.VR_SA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('bun.lock', 'package-lock.json') }}
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run visual regression tests
        run: bun run test:visual
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results
          retention-days: 14
