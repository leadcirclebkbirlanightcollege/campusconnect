<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Campus Connect - An LeadCircle Initiative</title>
    <meta
      name="description"
      content="Complete platform for managing college lectures, tracking attendance, earning points, and staying connected with your academic community."
    />
    <meta name="author" content="Campus Connect" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#1a56db" media="(prefers-color-scheme: light)" />
    <!-- iOS standalone launch -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Prevent address bar shrink on scroll -->
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Campus Connect" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512.png" />

    <!-- Prevent FOUC on iOS safe-area -->
    <style>
      body { background-color: #0b0f17; }
      html.light body { background-color: #ffffff; }
    </style>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Campus Connect - College Lecture &amp; Attendance Management" />
    <meta
      property="og:description"
      content="Complete platform for managing college lectures, tracking attendance, earning points, and staying connected with your academic community."
    />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:title" content="Campus Connect - College Lecture &amp; Attendance Management" />
    <meta
      name="twitter:description"
      content="Complete platform for managing college lectures, tracking attendance, earning points, and staying connected with your academic community."
    />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>
